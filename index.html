<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShellStrike Academy - Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "xterm": "https://esm.sh/xterm@5.3.0",
      "xterm-addon-fit": "https://esm.sh/xterm-addon-fit@0.8.0"
    }
  }
  </script>
  <style>
    body { background-color: #07090d; color: #e2e8f0; font-family: system-ui, sans-serif; }
    .xterm { padding: 12px; }
    .xterm-viewport::-webkit-scrollbar { width: 8px; }
    .xterm-viewport::-webkit-scrollbar-thumb { background: #1a2334; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useEffect, useRef, useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Terminal } from 'xterm';
    import { FitAddon } from 'xterm-addon-fit';

    // ==========================================
    // 1. VIRTUAL FILE SYSTEM (VFS)
    // ==========================================
    const createVFS = () => ({
      cwd: '/home/hacker',
      user: 'hacker',
      home: '/home/hacker',
      files: {
        '/home/hacker/notes.txt': { type: 'file', content: 'Target: 10.10.10.5\nPorts: 22, 80, 8080\n', perms: '-rw-r--r--', owner: 'hacker' },
        '/home/hacker/tools/recon.sh': { type: 'file', content: '#!/bin/bash\necho "[*] Running recon..."\n', perms: '-rwxr-xr-x', owner: 'hacker' },
        '/etc/passwd': { type: 'file', content: 'root:x:0:0:root:/root:/bin/bash\nhacker:x:1000:1000::/home/hacker:/bin/bash\n', perms: '-rw-r--r--', owner: 'root' },
        '/etc/shadow': { type: 'file', content: 'root:$6$hash:19000:0:99999:7:::\n', perms: '-rw-r-----', owner: 'root' },
      },
      dirs: {
        '/': ['home', 'etc', 'tmp', 'var'],
        '/home': ['hacker'],
        '/home/hacker': ['notes.txt', 'tools'],
        '/home/hacker/tools': ['recon.sh'],
        '/etc': ['passwd', 'shadow'],
        '/tmp': [],
        '/var': ['log'],
        '/var/log': ['auth.log']
      }
    });

    const resolvePath = (cwd, input) => {
      if (input === '~' || input === '~/') return '/home/hacker';
      if (input.startsWith('/')) return input.replace(/\/+$/, '') || '/';
      if (input === '..') return cwd.split('/').slice(0, -1).join('/') || '/';
      if (input === '.') return cwd;
      return (cwd === '/' ? '/' : cwd + '/') + input.replace(/\/+$/, '');
    };

    // ==========================================
    // 2. VIRTUAL NETWORK (For nmap, curl, etc.)
    // ==========================================
    const NETWORK = {
      '10.10.10.5': { 
        hostname: 'web01.corp.local', 
        ports: [
          { port: 22, state: 'open', service: 'ssh', version: 'OpenSSH 8.9p1 Ubuntu' },
          { port: 80, state: 'open', service: 'http', version: 'Apache 2.4.54' },
          { port: 8080, state: 'open', service: 'http-proxy', version: 'Apache Tomcat 9.0.65' },
          { port: 3306, state: 'filtered', service: 'mysql', version: '' }
        ] 
      },
      '10.10.10.10': {
        hostname: 'dc01.corp.local',
        ports: [
          { port: 53, state: 'open', service: 'domain', version: 'Microsoft DNS' },
          { port: 88, state: 'open', service: 'kerberos', version: 'Microsoft Windows Kerberos' },
          { port: 445, state: 'open', service: 'microsoft-ds', version: 'Windows Server 2019' }
        ]
      }
    };

    // ==========================================
    // 3. SHELL COMMAND EXECUTOR
    // ==========================================
    const execute = (input, vfs) => {
      const parts = input.trim().split(/\s+/);
      const cmd = parts[0];
      const args = parts.slice(1);

      switch (cmd) {
        case 'help':
          return 'Available commands: help, clear, whoami, pwd, ls, cd, cat, echo, nmap, curl, ping, uname, date';
        
        case 'clear':
          return '__CLEAR__';
        
        case 'whoami':
          return vfs.user;
        
        case 'pwd':
          return vfs.cwd;
        
        case 'uname':
          return args.includes('-a') ? 'Linux shellstrike 5.15.0-84-generic #93-Ubuntu SMP x86_64 GNU/Linux' : 'Linux';
        
        case 'date':
          return new Date().toString();
        
        case 'echo':
          return args.join(' ').replace(/\$(\w+)/g, (_, v) => (v === 'USER' ? vfs.user : v === 'PWD' ? vfs.cwd : ''));
        
        case 'cd': {
          const target = args[0] || '~';
          const newPath = resolvePath(vfs.cwd, target);
          if (vfs.dirs[newPath] !== undefined || newPath === '/') {
            vfs.cwd = newPath === '/' ? '/' : newPath;
            return '';
          }
          return `bash: cd: ${target}: No such file or directory`;
        }
        
        case 'ls': {
          const target = args.includes('-la') || args.includes('-l') ? vfs.cwd : (args[0] ? resolvePath(vfs.cwd, args[0]) : vfs.cwd);
          const isLong = args.includes('-la') || args.includes('-l') || args.includes('-a');
          const items = vfs.dirs[target] || [];
          const files = Object.keys(vfs.files).filter(f => f.startsWith(target + '/') && f.split('/').length === target.split('/').length + 1).map(f => f.split('/').pop());
          const allItems = [...items, ...files];
          
          if (isLong) {
            return `total ${allItems.length}\n` + allItems.map(item => {
              const fullPath = target === '/' ? `/${item}` : `${target}/${item}`;
              const isDir = items.includes(item);
              const file = vfs.files[fullPath];
              const perms = isDir ? 'drwxr-xr-x' : (file ? file.perms : '-rw-r--r--');
              const owner = isDir ? 'root' : (file ? file.owner : 'hacker');
              const size = isDir ? '4096' : (file ? file.content.length : '0');
              return `${perms} 1 ${owner.padEnd(8)} ${owner.padEnd(8)} ${size.padStart(5)} Sep 13 10:00 ${item}`;
            }).join('\n');
          }
          return allItems.join('  ') || '';
        }
        
        case 'cat': {
          if (!args[0]) return 'cat: missing file operand';
          const path = resolvePath(vfs.cwd, args[0]);
          if (vfs.files[path]) {
            if (path === '/etc/shadow' && vfs.user !== 'root') return `cat: ${args[0]}: Permission denied`;
            return vfs.files[path].content;
          }
          return `cat: ${args[0]}: No such file or directory`;
        }
        
        case 'nmap': {
          const target = args.find(a => !a.startsWith('-')) || '10.10.10.5';
          const ip = target === 'web01.corp.local' ? '10.10.10.5' : target;
          const host = NETWORK[ip];
          if (!host) return `Failed to resolve "${target}".\nNmap done: 1 IP address (0 hosts up) scanned in 1.02 seconds`;
          
          let out = `Starting Nmap 7.94 ( https://nmap.org )\nNmap scan report for ${host.hostname} (${ip})\nHost is up (0.042s latency).\n\nPORT     STATE SERVICE       VERSION\n`;
          host.ports.forEach(p => {
            out += `${p.port.toString().padEnd(4)} /tcp  ${p.state.padEnd(7)} ${p.service.padEnd(13)} ${p.version}\n`;
          });
          out += `\nNmap done: 1 IP address (1 host up) scanned in 2.14 seconds`;
          return out;
        }
        
        case 'curl': {
          const url = args.find(a => !a.startsWith('-')) || '';
          if (url.includes('10.10.10.5')) {
            return '<!DOCTYPE html>\n<html><head><title>Corp Intranet</title></head>\n<body><h1>Welcome to Corp Intranet</h1>\n<p>Internal use only.</p>\n<a href="/admin">Admin</a></body></html>';
          }
          return `curl: (6) Could not resolve host: ${url || 'unknown'}`;
        }
        
        case 'ping': {
          const target = args[0] || '8.8.8.8';
          return `PING ${target} (10.10.10.5) 56(84) bytes of data.\n64 bytes from 10.10.10.5: icmp_seq=1 ttl=63 time=42.1 ms\n64 bytes from 10.10.10.5: icmp_seq=2 ttl=63 time=41.8 ms\n\n--- ${target} ping statistics ---\n2 packets transmitted, 2 received, 0% packet loss`;
        }
        
        case '':
          return '';
          
        default:
          return `bash: ${cmd}: command not found`;
      }
    };

    // ==========================================
    // 4. REACT TERMINAL COMPONENT
    // ==========================================
    function App() {
      const terminalRef = useRef(null);
      const [vfs] = useState(createVFS);
      const xtermRef = useRef(null);
      const inputBuffer = useRef('');

      useEffect(() => {
        if (!terminalRef.current) return;

        const term = new Terminal({
          cursorBlink: true,
          fontFamily: '"JetBrains Mono", "Fira Code", monospace',
          fontSize: 14,
          theme: {
            background: '#0b0f16',
            foreground: '#e2e8f0',
            cursor: '#39ff88',
            selectionBackground: '#22d3ee44',
            green: '#39ff88',
            blue: '#22d3ee',
            yellow: '#fbbf24',
            red: '#ff5555'
          },
          scrollback: 1000
        });

        const fitAddon = new FitAddon();
        term.loadAddon(fitAddon);
        term.open(terminalRef.current);
        fitAddon.fit();
        xtermRef.current = term;

        const welcome = `\x1b[1;32m┌──(hacker㉿shellstrike)-[~]\n└─\x1b[1;34m$ \x1b[0mWelcome to ShellStrike Academy Terminal.\nType 'help' for available commands.\n\n`;
        term.write(welcome);
        writePrompt(term, vfs);

        term.onData((data) => {
          if (data === '\r') {
            term.write('\r\n');
            const output = execute(inputBuffer.current, vfs);
            if (output === '__CLEAR__') {
              term.clear();
            } else if (output) {
              term.write(output + '\r\n');
            }
            inputBuffer.current = '';
            writePrompt(term, vfs);
          } else if (data === '\u007F') {
            if (inputBuffer.current.length > 0) {
              inputBuffer.current = inputBuffer.current.slice(0, -1);
              term.write('\b \b');
            }
          } else if (data === '\u0003') {
            inputBuffer.current = '';
            term.write('^C\r\n');
            writePrompt(term, vfs);
          } else if (data >= String.fromCharCode(0x20) && data <= String.fromCharCode(0x7E)) {
            inputBuffer.current += data;
            term.write(data);
          }
        });

        const handleResize = () => fitAddon.fit();
        window.addEventListener('resize', handleResize);
        return () => {
          window.removeEventListener('resize', handleResize);
          term.dispose();
        };
      }, []);

      const writePrompt = (term, state) => {
        const cwd = state.cwd.replace('/home/hacker', '~');
        term.write(`\x1b[1;32m┌──(\x1b[1;34m${state.user}㉿shellstrike\x1b[1;32m)-[\x1b[0m${cwd}\x1b[1;32m]\n└─\x1b[1;34m$\x1b[0m `);
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="border-b border-slate-700 bg-[#0b0f16] px-6 py-4">
            <div className="max-w-5xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 bg-gradient-to-br from-green-400 to-cyan-400 rounded-lg flex items-center justify-center">
                  <span className="text-[#07090d] font-bold text-xl">S</span>
                </div>
                <div>
                  <h1 className="text-xl font-bold text-white">ShellStrike Academy</h1>
                  <p className="text-xs text-slate-400">Interactive Bash Emulator</p>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 p-4 md:p-8">
            <div className="max-w-5xl mx-auto flex flex-col gap-4">
              <div className="bg-[#0b0f16] border border-slate-700 rounded-lg px-4 py-3 flex items-center justify-between">
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2">
                    <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    <span className="text-sm text-slate-300">Terminal Active</span>
                  </div>
                  <span className="text-xs text-slate-500">hacker@shellstrike</span>
                </div>
                <button 
                  onClick={() => { vfs.cwd = '/home/hacker'; xtermRef.current?.clear(); writePrompt(xtermRef.current, vfs); }}
                  className="px-3 py-1 text-xs bg-slate-700 hover:bg-slate-600 rounded transition-colors text-slate-300"
                >
                  Reset Session
                </button>
              </div>

              <div ref={terminalRef} className="w-full h-[500px] rounded-lg overflow-hidden border border-slate-700 shadow-2xl" />

              <div className="bg-[#0b0f16] border border-slate-700 rounded-lg p-4">
                <h3 className="text-sm font-semibold text-slate-300 mb-3">Try these commands:</h3>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                  {[
                    { cmd: 'whoami', desc: 'Current user' },
                    { cmd: 'ls -la', desc: 'List files' },
                    { cmd: 'cat /etc/passwd', desc: 'View users' },
                    { cmd: 'nmap 10.10.10.5', desc: 'Scan target' },
                    { cmd: 'cd /etc', desc: 'Change dir' },
                    { cmd: 'curl http://10.10.10.5', desc: 'Fetch web' },
                    { cmd: 'ping 8.8.8.8', desc: 'Test network' },
                    { cmd: 'help', desc: 'All commands' },
                  ].map((item, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        const term = xtermRef.current;
                        if (!term) return;
                        term.write(item.cmd);
                        inputBuffer.current = item.cmd;
                        term.write('\r\n');
                        const output = execute(item.cmd, vfs);
                        if (output === '__CLEAR__') term.clear();
                        else if (output) term.write(output + '\r\n');
                        inputBuffer.current = '';
                        writePrompt(term, vfs);
                      }}
                      className="text-left px-3 py-2 bg-[#111826] hover:bg-[#1a2334] rounded border border-slate-600 transition-colors group"
                    >
                      <div className="font-mono text-xs text-green-400 group-hover:text-cyan-400">{item.cmd}</div>
                      <div className="text-xs text-slate-400 mt-1">{item.desc}</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
