<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShellStrike Academy - Terminal</title>
  <!-- Tailwind via CDN (Play CDN) with the app's custom colour palette -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: {
              600: '#1a2334',
              700: '#111826',
              800: '#0b0f16',
              900: '#07090d'
            },
            neon: {
              green: '#39ff88',
              cyan: '#22d3ee'
            }
          }
        }
      }
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <!-- The real app entry; Vite bundles & transpiles the TSX at build time -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
